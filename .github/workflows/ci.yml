name: CI

on:
  push:
    branches: [ "main", "work" ]
  pull_request:
    branches: [ "main", "work" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dry-run pipeline
        env:
          PYTHONPATH: src
        run: |
          python -m doctor_canamo.cli --dry-run --output /tmp/test.xlsx
      - name: Upload workbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-canamo-workbook
          path: /tmp/test.xlsx
